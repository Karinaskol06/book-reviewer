spring:
  application:
    name: book-reviewer

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookreviewer}
    username: ${DB_USERNAME:bookreview_user}
    password: ${DB_PASSWORD:bookreview_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    resources:
      static-locations: classpath:/static/,file:${app.storage.local.upload-dir}/

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Server Configuration
server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# Logging
logging:
  level:
    com.project.bookreviewer: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: ${JPA_SHOW_SQL:false}
    org.hibernate.type.descriptor.sql.BasicBinder: ${JPA_SHOW_SQL:false}

# Application Settings
application:
  security:
    bcrypt-strength: 12
  book:
    default-cover-url: "/images/book_placeholder.png"

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads-book-reviewer}
    avatar:
      dir: ${AVATAR_DIR:avatars}
      max-size: 10MB
      allowed-types: image/jpeg,image/png,image/webp
  storage:
    type: ${STORAGE_TYPE:local} # local | s3
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    local:
      upload-dir: ${UPLOAD_DIR:./uploads-book-reviewer}
      public-prefix: /uploads-book-reviewer
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_S3_REGION:eu-central-1}
      endpoint: ${AWS_S3_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      path-style-access: ${AWS_S3_PATH_STYLE:false}
  feed:
    backfill:
      days: 7
      limit: 20

elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}

# Observability - safe defaults
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # Prod-safe default: health only. local/docker profiles add info,prometheus,metrics.
        include: health
  endpoint:
    health:
      # Show component details only when authenticated (prod)
      show-details: when_authorized
      probes:
        enabled: true
      # DEGRADED (ES down) must not outrank UP for overall aggregation priority incorrectly,
      # and should map to HTTP 200 so orchestrators do not kill a still-serving app.
      status:
        order: DOWN, OUT_OF_SERVICE, DEGRADED, UP, UNKNOWN
        http-mapping:
          DEGRADED: 200
  health:
    # Custom indicator returns DEGRADED when ES is down (search falls back to PostgreSQL)
    elasticsearch:
      enabled: false
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Book reviewer API