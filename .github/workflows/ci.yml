name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bookreviewer-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bookreviewer-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 40m
          script: |
            # Bash stric mode (-e - exit on errors, -u - treat unset vars as errors, -o pipefail - fail pipeline on command fails)
            set -euo pipefail
            cd ~/book-reviewer
            # Download latest commits for main branch
            git fetch origin main
            # Reset the local main branch to the latest remote main branch (discard local changes)
            git reset --hard origin/main
            echo "Deploying commit: $(git rev-parse HEAD)"
            # Rebuild the images if needed and start containers in a bg
            docker compose -f docker-compose.aws-rds.yml up -d --build
            docker compose -f docker-compose.aws-rds.yml ps

            for i in $(seq 1 30); do
              if curl -sf http://localhost:8081/actuator/health >/dev/null; then
                echo "App healthcheck OK"
                curl -s http://localhost:8081/actuator/health
                exit 0
              fi
              echo "Waiting for app... attempt $i/30"
              sleep 5
            done

            # Rollback to previous version if healthcheck fails
            echo "App healthcheck failed — rolling back to $PREV"
            docker compose -f docker-compose.aws-rds.yml logs --tail=80 app
            # Reset the local main branch to the previous commit
            git reset --hard "$PREV"
            docker compose -f docker-compose.aws-rds.yml up -d --build
            docker compose -f docker-compose.aws-rds.yml ps
            # Confirm previous version comes back
            sleep 15
            curl -sf http://localhost:8081/actuator/health || echo "Rollback started but health still not OK, check EC2 manually"
            exit 1
