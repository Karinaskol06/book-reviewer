# Demo Alertmanager: alerts are visible in the UI (http://localhost:9093)
global:
  resolve_timeout: 5m

route:
  receiver: book-reviewer-demo
  group_by: [alertname, severity]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity = critical
      receiver: book-reviewer-demo
      continue: false
    - matchers:
        - severity = warning
      receiver: book-reviewer-demo

receivers:
  - name: book-reviewer-demo
    # Intentionally empty, will be swapped in slack_configs / email_configs when deploying
inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname, application]
