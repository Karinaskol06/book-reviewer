spring:
  application:
    name: book-reviewer

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookreviewer}
    username: ${DB_USERNAME:bookreview_user}
    password: ${DB_PASSWORD:bookreview_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    resources:
      static-locations: classpath:/static/,file:${app.storage.local.upload-dir}/

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Server Configuration
server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# Logging
logging:
  level:
    com.project.bookreviewer: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: ${JPA_SHOW_SQL:false}
    org.hibernate.type.descriptor.sql.BasicBinder: ${JPA_SHOW_SQL:false}

# Application Settings
application:
  security:
    bcrypt-strength: 12
  book:
    default-cover-url: "/images/book_placeholder.png"

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads-book-reviewer}
    avatar:
      dir: ${AVATAR_DIR:avatars}
      max-size: 10MB
      allowed-types: image/jpeg,image/png,image/webp
  storage:
    type: ${STORAGE_TYPE:local} # local | s3
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    local:
      upload-dir: ${UPLOAD_DIR:./uploads-book-reviewer}
      public-prefix: /uploads-book-reviewer
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_S3_REGION:eu-central-1}
      endpoint: ${AWS_S3_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      path-style-access: ${AWS_S3_PATH_STYLE:false}
  feed:
    backfill:
      days: 7
      limit: 20

elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}